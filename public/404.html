<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>New Pharma World</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment
      var pathSegmentsToKeep = 1; // 1 for project pages (e.g. username.github.io/repo-name/), 0 for custom domains or user pages

      var l = window.location;
      var pathSegments = l.pathname.split('/');
      // If deployed at root or custom domain, adjust segments
      if (pathSegments.length > 1 && pathSegments[1] !== 'new-pharma-world') {
        pathSegmentsToKeep = 0;
      }

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
