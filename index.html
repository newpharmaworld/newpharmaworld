<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Metadata -->
    <title>New Pharma World | Trusted Pharmaceutical Partner in Chennai</title>
    <meta name="description" content="New Pharma World provides trusted pharmaceutical products and healthcare supply solutions for hospitals, pharmacies, clinics and authorized customers in Chennai – 600024, Tamil Nadu, India." />
    <meta name="keywords" content="pharmaceutical supplier Chennai, medicines Kodambakkam, hospital supply Chennai, dialysis medicine, oncology products, transplant medicine, vaccines supply" />
    <meta name="author" content="New Pharma World" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="New Pharma World | Trusted Pharmaceutical Partner" />
    <meta property="og:description" content="Quality Medicines. Trusted Healthcare. Reliable pharmaceutical supply for hospitals, clinics, and pharmacies." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Single Page App redirect restore script for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-[#F5FAFA] text-slate-800 font-sans antialiased min-h-screen selection:bg-teal-100 selection:text-teal-900">
    <div id="root"></div>

  </body>
</html>
